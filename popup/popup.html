<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarRez Logger — Activity</title>
<style>
  :root {
    --brand:   #667eea;
    --brand2:  #764ba2;
    --green:   #11998e;
    --red:     #e53935;
    --yellow:  #f5a623;
    --bg:      #f7f8fc;
    --card:    #ffffff;
    --border:  #e8eaf0;
    --text:    #1a1d2e;
    --muted:   #8a90a8;
    --radius:  10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 480px;
    min-height: 520px;
    max-height: 600px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    padding: 14px 16px 12px;
    color: white;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  header h1 span.ver {
    font-size: 10px;
    font-weight: 500;
    opacity: .7;
    background: rgba(255,255,255,.18);
    padding: 2px 6px;
    border-radius: 20px;
    letter-spacing: .5px;
  }
  header p {
    font-size: 11px;
    opacity: .75;
    margin-top: 3px;
  }

  /* ── TABS ── */
  .tabs {
    display: flex;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .15s;
    user-select: none;
  }
  .tab.active {
    color: var(--brand);
    border-bottom-color: var(--brand);
  }
  .tab:hover:not(.active) { background: #f5f6fb; }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .stat {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 8px;
    background: var(--bg);
  }
  .stat .num { font-size: 20px; font-weight: 700; line-height: 1; }
  .stat .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
  .stat.pkg  .num { color: var(--brand); }
  .stat.lock .num { color: #fa709a; }
  .stat.lbl-s .num { color: #4facfe; }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    align-items: center;
  }
  .filter-bar input {
    flex: 1;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    background: var(--bg);
  }
  .filter-bar input:focus { border-color: var(--brand); }
  .filter-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all .12s;
  }
  .filter-btn.active { background: var(--brand); color: white; border-color: var(--brand); }
  .filter-btn:hover:not(.active) { border-color: var(--brand); color: var(--brand); }

  /* ── LOG LIST ── */
  .log-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
  }
  .log-list::-webkit-scrollbar { width: 5px; }
  .log-list::-webkit-scrollbar-track { background: transparent; }
  .log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .log-entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 11px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color .12s, box-shadow .12s;
    position: relative;
  }
  .log-entry:hover { border-color: var(--brand); box-shadow: 0 2px 10px rgba(102,126,234,.12); }

  .entry-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .type-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: .4px;
    flex-shrink: 0;
  }
  .type-badge.package { background: #ede9ff; color: var(--brand); }
  .type-badge.lockout { background: #fff0f5; color: #fa709a; }
  .type-badge.label   { background: #e8f8ff; color: #4facfe; }

  .entry-student { font-weight: 600; font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-time    { font-size: 10px; color: var(--muted); flex-shrink: 0; }
  .entry-log     {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: #444;
    background: var(--bg);
    border-radius: 5px;
    padding: 5px 7px;
    word-break: break-all;
    line-height: 1.5;
    margin-top: 2px;
  }
  .entry-staff   { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .copy-hint {
    position: absolute;
    top: 8px; right: 8px;
    font-size: 9px;
    color: var(--muted);
    opacity: 0;
    transition: opacity .15s;
  }
  .log-entry:hover .copy-hint { opacity: 1; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 36px; margin-bottom: 10px; }
  .empty p { font-size: 13px; }
  .empty small { font-size: 11px; margin-top: 4px; display: block; }

  /* ── STATS TAB ── */
  .staff-stats { padding: 10px; }
  .staff-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .staff-name { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .staff-breakdown { display: flex; gap: 8px; }
  .staff-stat {
    flex: 1;
    text-align: center;
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 2px;
  }
  .staff-stat .n { font-size: 16px; font-weight: 700; }
  .staff-stat .l { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  /* ── FOOTER ── */
  footer {
    display: flex;
    gap: 6px;
    padding: 8px 12px;
    background: white;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .footer-btn {
    flex: 1;
    padding: 7px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text);
    transition: all .12s;
    text-align: center;
  }
  .footer-btn:hover { border-color: var(--brand); color: var(--brand); background: #ede9ff; }
  .footer-btn.danger:hover { border-color: var(--red); color: var(--red); background: #ffebee; }

  /* ── COPIED FLASH ── */
  .copied-flash {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(17,153,142,.13);
    pointer-events: none;
    animation: flashOut .5s ease forwards;
    z-index: 999;
  }
  @keyframes flashOut { from{opacity:1} to{opacity:0} }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>📦 StarRez Logger <span class="ver">v3.1</span></h1>
  <p id="header-sub">Loading activity...</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="log">Activity Log</div>
  <div class="tab" data-tab="stats">Staff Stats</div>
</div>

<!-- STATS BAR (activity tab only) -->
<div class="stats-bar" id="stats-bar">
  <div class="stat pkg">
    <div class="num" id="count-package">0</div>
    <div class="lbl">Packages</div>
  </div>
  <div class="stat lock">
    <div class="num" id="count-lockout">0</div>
    <div class="lbl">Lockouts</div>
  </div>
  <div class="stat lbl-s">
    <div class="num" id="count-label">0</div>
    <div class="lbl">Labels</div>
  </div>
  <div class="stat">
    <div class="num" id="count-total">0</div>
    <div class="lbl">Total</div>
  </div>
</div>

<!-- FILTER BAR (activity tab only) -->
<div class="filter-bar" id="filter-bar">
  <input type="text" id="search-input" placeholder="Search student, room, staff...">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="package">Pkg</button>
  <button class="filter-btn" data-filter="lockout">Lock</button>
  <button class="filter-btn" data-filter="label">Label</button>
</div>

<!-- LOG LIST -->
<div class="log-list" id="log-list"></div>

<!-- STATS TAB CONTENT -->
<div class="staff-stats hidden" id="stats-tab"></div>

<!-- FOOTER -->
<footer>
  <button class="footer-btn" id="btn-export">⬇ Export CSV</button>
  <button class="footer-btn" id="btn-refresh">↺ Refresh</button>
  <button class="footer-btn danger" id="btn-clear">🗑 Clear All</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
